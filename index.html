<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="聊记">
<meta name="theme-color" content="#ff8fa3">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<title>聊记 · 发条消息就记好了</title>
<style>
:root{--bg:#f2f2f5;--card:#fff;--text:#111;--sub:#8a8a8f;--line:#e6e6ea;--me:#ff8fa3;--meText:#fff;--bot:#fff;--accent:#ff6b8a;--ok:#34c759;--warn:#ff9f0a;--bad:#ff3b30}
@media(prefers-color-scheme:dark){:root{--bg:#0f0f12;--card:#1c1c1f;--text:#f2f2f7;--sub:#8e8e93;--line:#2c2c30;--bot:#242428;--me:#c94b64}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei",sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;background:var(--bg);position:relative}
header{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header .t{flex:1;text-align:center;font-weight:600}
header .t small{display:block;font-weight:400;font-size:11px;color:var(--sub)}
header button{background:none;border:0;color:var(--text);font-size:17px;padding:6px 8px;border-radius:8px;cursor:pointer}
header button:active{background:var(--line)}
header .ghost{width:33px;flex:0 0 33px}
#summary{cursor:pointer}
#summary:active{background:var(--bg)}
#summary{margin:8px 12px 0;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
#summary .line{display:flex;align-items:baseline;gap:7px;padding:9px 14px 9px;font-size:12.5px;color:var(--sub)}
#summary .line b{font-size:18px;font-weight:700;color:var(--text);letter-spacing:-.4px;font-variant-numeric:tabular-nums}
#summary .line .rt{margin-left:auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
#summary .line .rt.bad{color:var(--bad);font-weight:600}
#summary .caret{color:var(--sub);font-size:15px;margin-left:2px;opacity:.6}
#summary .bar{height:2px;background:var(--line)}
#summary .fill{height:100%;width:0;background:var(--accent);transition:width .4s}
main{flex:1;overflow-y:auto;padding:10px 12px 6px;-webkit-overflow-scrolling:touch}
.msg{display:flex;gap:8px;margin-bottom:10px;align-items:flex-start}
.msg.me{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;background:var(--card);flex:0 0 30px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.body{max-width:78%}
.bub{background:var(--bot);border-radius:4px 13px 13px 13px;padding:8px 11px;box-shadow:0 1px 2px rgba(0,0,0,.05);word-break:break-word}
.msg.me .bub{background:var(--me);color:var(--meText);border-radius:14px 4px 14px 14px}
.msg.sys{justify-content:center}
.msg.sys .bub{background:none;box-shadow:none;color:var(--sub);font-size:12px;padding:4px 10px;border-radius:10px;max-width:90%;text-align:center}
.entry{padding:0;overflow:hidden;min-width:220px}
.entry .sub{font-size:11.5px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .top{display:flex;align-items:center;gap:9px;padding:9px 12px}
.entry .cat{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:15px;background:rgba(0,0,0,.05);flex:0 0 26px}
.entry .mid{flex:1;min-width:0}
.entry .n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.entry .amt.out{color:var(--bad)}
.entry .amt.in{color:var(--ok)}
.entry .acts{display:none;border-top:1px solid var(--line);font-size:12px}
.entry.open .acts{display:flex}
.entry .acts button{flex:1;background:none;border:0;padding:9px 2px;color:var(--text);font-size:12px;cursor:pointer;white-space:nowrap}
.entry .acts button+button{border-left:1px solid var(--line)}
.entry .acts .del{color:var(--bad)}
.field input[type=date]{width:150px;text-align:left}
.quick{display:flex;gap:8px;margin:12px 0 0}
.quick button{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 0;font-size:13px;color:var(--text);cursor:pointer}
.quick button:active{background:var(--line)}
.minidel{display:block;width:100%;margin:4px 0 6px;background:none;border:1px dashed var(--line);border-radius:10px;padding:8px 0;font-size:12px;color:var(--bad);cursor:pointer}
.minidel:active{background:var(--card)}
footer{background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);position:sticky;bottom:0}
.chips{display:none;gap:6px;overflow-x:auto;padding:0 2px 8px;scrollbar-width:none}
.chips.on{display:flex}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;background:var(--bg);border:1px solid var(--line);color:var(--sub);border-radius:14px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.chips button:active{background:var(--line)}
.inrow{display:flex;gap:8px;align-items:center}
.inrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:18px;padding:9px 14px;font-size:15px;outline:none}
.inrow input:focus{border-color:var(--accent)}
.inrow button{border:0;background:var(--accent);color:#fff;border-radius:18px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
.inrow button:disabled{opacity:.4}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:60;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .panel{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:86vh;overflow-y:auto}
.sheet h3{margin:0 0 14px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{background:none;border:0;color:var(--accent);font-size:14px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid button{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 4px;font-size:12px;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.grid button span:first-child{font-size:19px}
.grid button.sel{border-color:var(--accent);background:rgba(255,107,138,.12)}
.field{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.field input{width:110px;text-align:right;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:7px 10px;font-size:14px;outline:none}
.field input.wide{width:150px;text-align:left}
.adv{margin:14px 0 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.adv summary{padding:12px 14px;font-size:13.5px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;color:var(--sub)}
.adv summary::-webkit-details-marker{display:none}
.adv summary span{font-size:11.5px;opacity:.75}
.adv .field{padding:10px 14px;margin:0;border-top:1px solid var(--line)}
.btn2{width:100%;margin-top:14px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px;cursor:pointer}
.btn2.pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.stats{font-size:13px}
.stats .day{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.stats .day .d{width:42px;color:var(--sub);font-variant-numeric:tabular-nums}
.stats .day .b{flex:1;height:14px;background:var(--bg);border-radius:4px;overflow:hidden}
.stats .day .b i{display:block;height:100%;background:linear-gradient(90deg,#ffc2cf,var(--accent));border-radius:4px}
.stats .day .v{width:62px;text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:18px 0}
@media(display-mode:standalone){header{padding-top:calc(env(safe-area-inset-top) + 14px)}}
header button.dot{position:relative}
header button.dot::after{content:"";position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--bad)}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);bottom:calc(env(safe-area-inset-bottom) + 72px);background:#2b2b30;color:#fff;border-radius:20px;padding:9px 6px 9px 16px;font-size:13px;display:none;align-items:center;gap:10px;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.28);white-space:nowrap}
#toast.on{display:flex}
#toast button{background:none;border:0;color:#ff9fb2;font-size:13px;font-weight:600;padding:2px 10px;cursor:pointer}
#upd{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 8px);background:var(--accent);color:#fff;border-radius:16px;padding:7px 16px;font-size:12.5px;font-weight:600;display:none;z-index:85;box-shadow:0 4px 14px rgba(255,107,138,.4);cursor:pointer}
#upd.on{display:block}
.bub.typing{display:flex;gap:5px;align-items:center;padding:12px 14px}
.bub.typing i{width:6px;height:6px;border-radius:50%;background:var(--sub);opacity:.5;animation:tk 1.1s infinite}
.bub.typing i:nth-child(2){animation-delay:.18s}
.bub.typing i:nth-child(3){animation-delay:.36s}
@keyframes tk{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
.msg.sys .bub.time{font-size:11.5px;letter-spacing:.2px}
/* 记账日期按钮（长按输入框也能唤出） */
.inrow .dbtn{flex:0 0 auto;width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--sub);font-size:12px;font-weight:600;padding:0;cursor:pointer;line-height:1}
.inrow .dbtn.on{background:var(--warn);border-color:var(--warn);color:#fff}
/* 统计弹层的时间范围切换 */
.tabs{display:flex;gap:6px;margin:0 0 12px}
.tabs button{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 0;font-size:13px;color:var(--sub);cursor:pointer;font-weight:500}
.tabs button.sel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
/* 分类点开后的流水 */
.stats .citem2{display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer;border-radius:8px}
.stats .citem2:active{background:var(--bg)}
.stats .citem2 .d{width:84px;color:var(--sub);font-size:12.5px;flex:0 0 84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats .citem2 .b{flex:1;height:14px;background:var(--bg);border-radius:4px;overflow:hidden}
.stats .citem2 .b i{display:block;height:100%;background:linear-gradient(90deg,#ffc2cf,var(--accent));border-radius:4px}
.stats .citem2 .v{width:62px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.stats .crows{padding:0 0 8px}
.stats .citem{display:flex;align-items:baseline;gap:8px;padding:5px 8px;font-size:12.5px;color:var(--sub)}
.stats .citem .dt2{flex:0 0 42px;font-variant-numeric:tabular-nums}
.stats .citem .am2{font-variant-numeric:tabular-nums;color:var(--bad);font-weight:600}
.stats .citem .am2.in{color:var(--ok)}
/* 每天一块：日期 + 当天合计，点一下收起这一天的消息 */
.dayhead{display:flex;align-items:center;justify-content:center;gap:8px;margin:16px auto 9px;padding:3px 10px;font-size:11.5px;color:var(--sub);cursor:pointer;user-select:none;max-width:max-content;border-radius:12px}
.dayhead:active{background:var(--line)}
.dayhead .dl{font-weight:600;color:var(--text);font-size:11.5px}
.dayhead .dt{font-variant-numeric:tabular-nums}
.dayhead .cv{font-size:9px;opacity:.55;transition:transform .18s}
.dayhead.folded .cv{transform:rotate(-90deg)}
.msg.hide{display:none}
.stats .drow{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.stats .drow b{font-weight:600;flex:0 0 92px}
.stats .drow .cnt{color:var(--sub);font-size:11.5px;flex:1;text-align:left}
.stats .drow .out{font-variant-numeric:tabular-nums;color:var(--bad);font-weight:600}
.stats .drow .inc{font-variant-numeric:tabular-nums;color:var(--ok);font-size:11.5px;margin-left:6px}
.stats .drow{cursor:pointer}
.stats .drow:active{background:var(--bg)}
.stats .ditems{padding:2px 0 8px;border-bottom:1px solid var(--line);background:var(--bg);border-radius:0 0 10px 10px}
.stats .dline{display:flex;align-items:baseline;gap:8px;padding:5px 6px;font-size:12.5px}
.stats .dline .tm{color:var(--sub);font-variant-numeric:tabular-nums;flex:0 0 38px}
.stats .dline .em{flex:0 0 16px}
.stats .dline .ct{flex:1;color:var(--sub)}
.stats .dline .am{font-variant-numeric:tabular-nums;font-weight:600}
.stats .dline .am.out{color:var(--bad)}
.stats .dline .am.in{color:var(--ok)}
#stream{scroll-behavior:smooth}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="ghost"></span>
    <div class="t">账本<small id="hSub">今天还没记账</small></div>
    <button id="btnSet" aria-label="设置">⚙</button>
  </header>
  <div id="summary" role="button" aria-label="查看统计">
    <div class="line"><span id="sLbl">本月花</span><b id="sOut">¥0</b><span class="rt" id="sRight">还没设预算</span><span class="caret">›</span></div>
    <div class="bar"><div class="fill" id="sBar"></div></div>
  </div>
  <main id="stream"></main>
  <footer>
    <div class="chips" id="chips"></div>
    <div class="inrow">
      <button class="dbtn" id="btnDay" aria-label="选择记账日期">今</button>
      <input id="inp" placeholder="说一句，比如 午饭12" autocomplete="off" enterkeyhint="send">
      <button id="send">发送</button>
    </div>
  </footer>
</div>
<div id="toast"></div>
<div id="upd">有新版本 · 点这里更新</div>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<script>
/* ---------- 数据 ---------- */
var KEY="chatledger.v2";
var CATS=[
 {k:"早餐",e:"🥟",ws:["早饭","早餐","包子","豆浆","煎饼","肠粉","油条","馒头","早点","咖啡站"]},
 {k:"午餐",e:"🍱",ws:["午饭","午餐","外卖","盖饭","麻辣烫","快餐","食堂","盒饭","拉面","米线","螺蛳粉","黄焖鸡"]},
 {k:"晚餐",e:"🍜",ws:["晚饭","晚餐","夜宵","宵夜","烧烤","火锅","聚餐","麻辣香锅","小龙虾"]},
 {k:"饮品",e:"🥤",ws:["奶茶","咖啡","瑞幸","星巴克","可乐","柠檬茶","果汁","蜜雪","喜茶","霸王茶姬","茶百道","纯茶"]},
 {k:"零食",e:"🍪",ws:["零食","薯片","巧克力","饼干","水果","西瓜","苹果","香蕉","冰淇淋","雪糕","蛋糕","面包"]},
 {k:"交通",e:"🚇",ws:["打车","滴滴","地铁","公交","高铁","火车","加油","停车","机票","单车","顺风车"]},
 {k:"日用",e:"🧻",ws:["抽纸","纸巾","日用","洗发水","牙膏","洗衣液","超市","便利店","垃圾袋","沐浴露","秤","体重秤","收纳","拖把","台灯","垃圾桶"]},
 {k:"购物",e:"🛍️",ws:["衣服","鞋","淘宝","京东","拼多多","网购","快递","化妆品","护肤品","耳机","壳","保护壳","手机壳","平板","充电","数据线","充电器","配件","键盘","鼠标","显示器","家电","手表","眼镜"]},
 {k:"居住",e:"🏠",ws:["房租","水电","燃气","物业","电费","水费"]},
 {k:"通讯",e:"📱",ws:["话费","流量","宽带","会员","订阅","网费","iCloud"]},
 {k:"娱乐",e:"🎮",ws:["电影","游戏","KTV","门票","演出","充值","皮肤","桌游","演唱会"]},
 {k:"医疗",e:"💊",ws:["药","医院","挂号","体检","看病","牙","挂号费"]},
 {k:"学习",e:"📚",ws:["书","课程","网课","文具","考试","培训","会员课"]},
 {k:"人情",e:"🎁",ws:["红包","礼物","份子","请客","随礼","转给","打赏"]},
 {k:"收入",e:"💰",ws:["工资","报销","奖金","退款","收入","到账","赚了","发了"],income:true},
 {k:"其他",e:"🧾",ws:[]}
];
var S=load();
function load(){
  try{var r=JSON.parse(localStorage.getItem(KEY));if(r&&r.entries)return r;}catch(e){}
  return {settings:{budget:3000,name:"小账",avatar:"🐱"},entries:[],msgs:[],seeded:false};
}
function dayKey(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function save(){
  try{
    var cur=localStorage.getItem(KEY),today=dayKey();
    if(cur&&S.snapDay!==today){
      localStorage.setItem(KEY+".bak",cur);
      localStorage.setItem(KEY+".bakday",String(S.snapDay||""));
      S.snapDay=today;
    }
    localStorage.setItem(KEY,JSON.stringify(S));
  }catch(e){}
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
/* ---------- 解析 ---------- */
var CN={零:0,〇:0,一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
var UNIT={十:10,百:100,千:1000};
function cn2num(s){var t=0,sec=0,n=0;for(var i=0;i<s.length;i++){var c=s[i];
  if(CN[c]!==undefined){n=CN[c];}
  else if(UNIT[c]!==undefined){if(n===0)n=1;sec+=n*UNIT[c];n=0;}
  else if(c==="万"){sec+=n;t+=sec*10000;sec=0;n=0;}}
  return t+sec+n;}
function pickAmount(text,catHit){
  var a=text.match(/[0-9]+(?:\.[0-9]{1,2})?/);
  if(a){var v=parseFloat(a[0]);return isFinite(v)&&v>0?v:null;}
  var m=text.match(/[零〇一二两三四五六七八九十百千]+/);
  if(m){
    var base=cn2num(m[0]);
    if(!(base>0))return null;
    var hasUnit=/(?:块钱|块|元|RMB|¥)/.test(text);
    if(!hasUnit&&!catHit)return null;
    var jiao=text.match(/(?:块钱|块|元)\s*([一二三四五六七八九])(?:\s*(?:角|毛))?/);
    if(jiao){base+=CN[jiao[1]]/10;}
    return base;
  }
  return null;}
function pickCat(text){
  for(var i=0;i<CATS.length;i++){var c=CATS[i];
    for(var j=0;j<c.ws.length;j++){if(text.indexOf(c.ws[j])>-1)return{c:c,hit:c.ws[j],conf:0.9};}}
  /* 没命中关键词：只有「几乎就是个金额」时才按时段猜，带实义字的（如「平板保护壳」）一律记成「其他」 */
  var rest=text
    .replace(/[0-9]+(?:\.[0-9]{1,2})?/g,"")
    .replace(/[零〇一二两三四五六七八九十百千万]+/g,"")
    .replace(/块钱|块|元|角|毛|RMB|¥/g,"")
    .replace(/昨天|前天|今早|今天|刚才|上午|下午|中午|早上|晚上|凌晨|夜里|夜宵|早餐时间/g,"")
    .replace(/[\s,，。.!！?？、~～\-+\/]/g,"");
  if(!rest.length){
    var h=new Date().getHours();
    if(h<5)return{c:CATS[2],hit:"amount",conf:0.6};
    if(h<10)return{c:CATS[0],hit:"amount",conf:0.75};
    if(h<15)return{c:CATS[1],hit:"amount",conf:0.75};
    return{c:CATS[2],hit:"amount",conf:0.75};

function parse(text){
  var pc=pickCat(text);
  var amount=pickAmount(text,!!pc.hit);
  if(!amount)return null;
  var ts=Date.now(),hasD=0;
  if(text.indexOf("昨天")>-1){ts-=86400000;hasD=1;}
  else if(text.indexOf("前天")>-1){ts-=172800000;hasD=1;}
  else if(text.indexOf("大前天")>-1){ts-=259200000;hasD=1;}
  var inc=pc.c.income||text.indexOf("收入")>-1||text.indexOf("+)")>-1;
  return {amount:amount,cat:pc.c.k,emoji:pc.c.e,conf:pc.conf,ts:ts,hasD:hasD,income:!!inc,note:text.trim()};
}
/* 一句话多笔：只有「每一段都能独立解析出金额」时才拆，拆不动就退回整句 */
function parseAll(text){
  var t=String(text||"").trim();
  if(!t)return [];
  var segs=t.split(/[，,、;；+＋\n]+/).map(function(x){return x.trim();}).filter(Boolean);
  if(segs.length>1){
    var out=segs.map(parse);
    if(out.every(function(p){return p&&p.amount>0;}))return out;
    var whole=parse(t);
    return whole?[whole]:[];
  }
  var bySp=t.split(/\s+/).filter(Boolean);
  if(bySp.length>1){
    var o2=bySp.map(parse);
    if(o2.every(function(p){return p&&p.amount>0;}))return o2;
  }
  var one=parse(t);
  return one?[one]:[];
}

var TYPING_MS=520;

/* 一次可能记多笔：合并成一条用户原话 + 多张卡片，只回一句话 */
function addBatch(list,rawText){
  if(!list||!list.length)return;
  /* 补记：整段（原话气泡 + 卡片）一起落到那一天，别把一段对话劈成两个日块 */
  var off=list.every(function(p){return !p.hasD;})?_dayOff:0;
  var base=Date.now()-off*86400000;
  var sm={id:uid(),ts:base,from:"me",type:"text",text:rawText};
  S.msgs.push(sm);
  var es=[];
  list.forEach(function(p){
    var ts=p.ts||Date.now();
    /* 原话里没写「昨天/前天」时，才套用底部日期按钮选的补记日期 */
    if(!p.hasD&&off>0)ts-=off*86400000;
    var e={id:uid(),ts:ts,amount:Math.round(p.amount*100)/100,cat:p.cat,emoji:p.emoji,income:p.income,conf:p.conf,note:p.note,srcMsg:sm.id};
    S.entries.push(e);es.push(e);
  });
  save();render();
  var wantAI=aiOn();
  var local="";
  for(var i=0;i<es.length;i++){var t=reply(es[i]);if(t){local=t;break;}}
  function push(txt){
    typing(false);
    es.forEach(function(e){S.msgs.push({id:uid(),ts:base+1,from:"bot",type:"entry",entryId:e.id});});
    if(txt)S.msgs.push({id:uid(),ts:base+2,from:"bot",type:"text",text:txt});
    if(off>0){_dayOff=0;syncDayBtn();}
    save();render();
  }
  if(!wantAI&&!local){push("");return;}
  typing(true);
  setTimeout(function(){
    if(wantAI){aiLine(es[es.length-1],function(t){push(t||local);});return;}
    push(local);
  },TYPING_MS);
}

/* ---------- 周报：一周过完第一次打开，角色主动说一句 ---------- */
function weekStartMs(d){
  var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);
  return x.getTime();
}
function weeklyReport(){
  var ws=weekStartMs(new Date());
  var key=dk(ws);
  if(S.wkSaid===key)return "";
  var pw=ws-7*86400000,ppw=pw-7*86400000;
  var prev=S.entries.filter(function(e){return !e.income&&e.ts>=pw&&e.ts<ws;});
  if(!prev.length){return "";}
  S.wkSaid=key;
  var a=sum(prev);
  var before=S.entries.filter(function(e){return !e.income&&e.ts>=ppw&&e.ts<pw;});
  var b=before.length?sum(before):0;
  var days={};prev.forEach(function(e){days[dk(e.ts)]=1;});
  var nDay=Object.keys(days).length;
  var t;
  if(b<=0){t="上周花了 "+money(a)+"，记了 "+nDay+" 天";}
  else{
    var d=Math.round(Math.abs(a-b)*100)/100;
    if(d<1){t="上周花了 "+money(a)+"，跟前一周差不多";}
    else if(a<b){t="上周花了 "+money(a)+"，比前一周少 "+money(d);}
    else{t="上周花了 "+money(a)+"，比前一周多 "+money(d);}
  }
  var byCat={};
  prev.forEach(function(e){byCat[e.cat]=(byCat[e.cat]||0)+e.amount;});
  var top=Object.keys(byCat).sort(function(x,y){return byCat[y]-byCat[x];})[0];
  if(top&&nDay>=2)t+="，"+(top==="其他"?"花得最多的是杂项":top)+"最多";
  return t;

function monthEntries(){var d=new Date(),y=d.getFullYear(),m=d.getMonth();

/* 批量删：统计里按分类或按天一次清掉；确认后执行，4 秒内可撤销 */
function deleteMany(ids,label,after){
  var set={};ids.forEach(function(i){set[i]=1;});
  var gone=S.entries.filter(function(e){return set[e.id];});
  if(!gone.length)return;
  if(!confirm("删除"+label+"的 "+gone.length+" 笔？删完 4 秒内能撤销。"))return;
  var entBak=S.entries.slice(),msgsBak=S.msgs.slice();
  S.entries=S.entries.filter(function(e){return !set[e.id];});
  S.msgs=S.msgs.filter(function(m){return !(m.entryId&&set[m.entryId]);});
  /* 原话气泡：这段原话下面已经没有别的账了才一起删，别留孤儿 */
  var alive={};S.entries.forEach(function(e){if(e.srcMsg)alive[e.srcMsg]=1;});
  var srcIds={};gone.forEach(function(e){if(e.srcMsg)srcIds[e.srcMsg]=1;});
  S.msgs=S.msgs.filter(function(m){
    return !(m.from==="me"&&m.type==="text"&&srcIds[m.id]&&!alive[m.id]);
  });
  save();render();if(after)after();
  toast("已删除 "+gone.length+" 笔 · "+label,"撤销",function(){
    S.entries=entBak;S.msgs=msgsBak;save();render();if(after)after();
  });
}

/* 统计弹层的时间范围：本周 / 本月 / 上月 */
var _scope="month";
function scopeRange(sc){
  var now=new Date(),from,to=now.getTime(),label;
  if(sc==="week"){
    var wd=(now.getDay()+6)%7;
    var s=new Date(now.getFullYear(),now.getMonth(),now.getDate()-wd);
    from=s.getTime();label="本周";
  }else if(sc==="last"){
    var s2=new Date(now.getFullYear(),now.getMonth()-1,1);
    from=s2.getTime();
    to=new Date(now.getFullYear(),now.getMonth(),1).getTime()-1;
    label="上月";
  }else{
    from=new Date(now.getFullYear(),now.getMonth(),1).getTime();label="本月";
  }
  return {from:from,to:to,label:label};
}

function backupCount(){

/* ---------- CSV 导回：跟导出的格式对齐，也能吃别人给的账单 ---------- */
function csvCells(line){
  var out=[],cur="",q=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(q){
      if(c==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}
      else cur+=c;
    }else{
      if(c==='"')q=true;
      else if(c===","){out.push(cur);cur="";}
      else cur+=c;
    }
  }
  out.push(cur);
  return out;
}
function catOf(name){
  for(var i=0;i<CATS.length;i++){if(CATS[i].k===name)return CATS[i];}
  return CATS[15];
}
/* 返回 {add:[],dup:n,bad:n}，不直接落到 S 里，先给用户看数 */
function parseCsv(text){
  var lines=String(text).replace(/^\ufeff/,"").split(/\r\n|\n|\r/).filter(function(x){return x.trim();});
  var add=[],dup=0,bad=0;
  var seen={};
  S.entries.forEach(function(e){
    var d=new Date(e.ts);
    seen[dk(e.ts)+" "+hm(e.ts)+" "+e.cat+" "+e.amount.toFixed(2)]=1;
  });
  lines.forEach(function(line,idx){
    var c=csvCells(line);
    if(idx===0&&!/^\d{4}/.test((c[0]||"").trim()))return; /* 表头 */
    var dm=(c[0]||"").trim().match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    if(!dm){bad++;return;}
    var amt=parseFloat(String(c[3]||"").replace(/[^\d.-]/g,""));
    if(!isFinite(amt)||amt<=0){bad++;return;}
    var tm=(c[1]||"").trim().match(/(\d{1,2}):(\d{1,2})/);
    var d=new Date(+dm[1],+dm[2]-1,+dm[3],tm?+tm[1]:12,tm?+tm[2]:0,0,0);
    var cat=catOf((c[2]||"").trim());
    var income=/收入|income/i.test((c[4]||"").trim())||cat.income;
    var note=(c[5]||"").trim()||cat.k;
    var k=dk(d.getTime())+" "+hm(d.getTime())+" "+cat.k+" "+amt.toFixed(2);
    if(seen[k]){dup++;return;}
    seen[k]=1;
    add.push({id:uid(),ts:d.getTime(),amount:Math.round(amt*100)/100,cat:cat.k,emoji:cat.e,income:!!income,conf:1,note:note});
  });
  return {add:add,dup:dup,bad:bad};
}
function needBackup(){
  if(!S.entries.length)return false;
  if(!S.lastExport)return S.entries.length>=15;
  return Date.now()-S.lastExport>30*86400000;

/* ---------- 输入 ---------- */
function submit(){
  var i=document.getElementById("inp");var t=i.value.trim();if(!t)return;
  i.value="";
  var ps=parseAll(t);
  if(!ps.length){
    S.msgs.push({id:uid(),ts:Date.now(),from:"me",type:"text",text:t});
    S.msgs.push({id:uid(),ts:Date.now()+1,from:"bot",type:"text",text:"没听出金额。试着说「午饭12」「打车 23.5」「奶茶十五」"});
    save();render();return;}
  addBatch(ps,t);}
document.getElementById("send").onclick=submit;
document.getElementById("inp").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();submit();}});
document.getElementById("summary").onclick=openStats;
document.getElementById("btnSet").onclick=openSettings;
document.getElementById("btnDay").onclick=openDayPicker;
/* 长按输入框也能唤出日期选择：iPhone 上比点小按钮顺手 */
(function(){
  var i=document.getElementById("inp"),t=0;
  i.addEventListener("touchstart",function(){t=setTimeout(function(){t=0;openDayPicker();},550);},{passive:true});
  ["touchend","touchmove","touchcancel"].forEach(function(k){
    i.addEventListener(k,function(){if(t){clearTimeout(t);t=0;}},{passive:true});});
  i.addEventListener("contextmenu",function(e){e.preventDefault();openDayPicker();});
})();
var CHIPS=["午饭12","奶茶15","地铁4","打车23","超市68","工资8000"];
document.getElementById("chips").innerHTML=CHIPS.map(function(c){return "<button>"+c+"</button>";}).join("");
document.getElementById("chips").addEventListener("click",function(e){
  if(e.target.tagName!=="BUTTON")return;
  document.getElementById("inp").value=e.target.textContent;submit();});
/* ---------- 启动 ---------- */
function bootstrap(){
  if(S.seeded)return;
  S.seeded=true;
  S.msgs.push({id:uid(),ts:Date.now()-2000,from:"bot",type:"text",text:"我是 "+(S.settings.name||"小账")+"，发一句话我就记好"});
  S.msgs.push({id:uid(),ts:Date.now()-1000,from:"bot",type:"text",text:"午饭12 · 奶茶十五 · 昨天打车38"});
  save();
}
(function(){
  var q=new URLSearchParams(location.search).get("add");
  if(q){var ps=parseAll(decodeURIComponent(q));if(ps.length){addBatch(ps,decodeURIComponent(q));var u=location.pathname;history.replaceState({},"",u);}}
})();
bootstrap();syncDayBtn();
var _wk=weeklyReport();
if(_wk){S.msgs.push({id:uid(),ts:Date.now()-500,from:"bot",type:"text",text:_wk});save();}
nudge();render();
/* iOS 键盘弹起时把消息流顶上来，别挡住输入框 */
if(window.visualViewport){
  visualViewport.addEventListener("resize",function(){
    var st=document.getElementById("stream");
    if(!st)return;
    st.scrollTop=st.scrollHeight;
  });
}
/* 新版本提示：SW 换了就浮一条，点了立刻刷新 */
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    var hadCtl=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("./sw.js").then(function(reg){
      function offer(){
        var u=document.getElementById("upd");
        if(!u)return;
        u.classList.add("on");
        u.onclick=function(){
          if(reg.waiting)reg.waiting.postMessage("skip");
          location.reload();
        };
      }
      if(reg.waiting)offer();
      /* install 里已 skipWaiting，新的直接接管；接管那一刻提示刷新 */
      navigator.serviceWorker.addEventListener("controllerchange",function(){
        if(hadCtl)offer();
      });
      reg.addEventListener("updatefound",function(){
        var nw=reg.installing;
        if(!nw)return;
        nw.addEventListener("statechange",function(){
          if(nw.state==="installed"&&navigator.serviceWorker.controller)offer();
        });
      });
    }).catch(function(){});
  });
}
</script>
