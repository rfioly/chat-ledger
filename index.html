<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="聊记">
<meta name="theme-color" content="#ff8fa3">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<title>聊记 · 发条消息就记好了</title>
<style>
:root{--bg:#f2f2f5;--card:#fff;--text:#111;--sub:#8a8a8f;--line:#e6e6ea;--me:#ff8fa3;--meText:#fff;--bot:#fff;--accent:#ff6b8a;--ok:#34c759;--warn:#ff9f0a;--bad:#ff3b30}
@media(prefers-color-scheme:dark){:root{--bg:#0f0f12;--card:#1c1c1f;--text:#f2f2f7;--sub:#8e8e93;--line:#2c2c30;--bot:#242428;--me:#c94b64}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei",sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;background:var(--bg);position:relative}
header{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header .t{flex:1;text-align:center;font-weight:600}
header .t small{display:block;font-weight:400;font-size:11px;color:var(--sub)}
header button{background:none;border:0;color:var(--text);font-size:17px;padding:6px 8px;border-radius:8px;cursor:pointer}
header button:active{background:var(--line)}
header .ghost{width:33px;flex:0 0 33px}
#summary{cursor:pointer}
#summary:active{background:var(--bg)}
#summary{margin:8px 12px 0;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
#summary .line{display:flex;align-items:baseline;gap:7px;padding:9px 14px 9px;font-size:12.5px;color:var(--sub)}
#summary .line b{font-size:18px;font-weight:700;color:var(--text);letter-spacing:-.4px;font-variant-numeric:tabular-nums}
#summary .line .rt{margin-left:auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
#summary .line .rt.bad{color:var(--bad);font-weight:600}
#summary .caret{color:var(--sub);font-size:15px;margin-left:2px;opacity:.6}
#summary .bar{height:2px;background:var(--line)}
#summary .fill{height:100%;width:0;background:var(--accent);transition:width .4s}
main{flex:1;overflow-y:auto;padding:10px 12px 6px;-webkit-overflow-scrolling:touch}
.msg{display:flex;gap:8px;margin-bottom:10px;align-items:flex-start}
.msg.me{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;background:var(--card);flex:0 0 30px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.body{max-width:78%}
.bub{background:var(--bot);border-radius:4px 13px 13px 13px;padding:8px 11px;box-shadow:0 1px 2px rgba(0,0,0,.05);word-break:break-word}
.msg.me .bub{background:var(--me);color:var(--meText);border-radius:14px 4px 14px 14px}
.msg.sys{justify-content:center}
.msg.sys .bub{background:none;box-shadow:none;color:var(--sub);font-size:12px;padding:4px 10px;border-radius:10px;max-width:90%;text-align:center}
.entry{padding:0;overflow:hidden;min-width:150px}
.entry .top{display:flex;align-items:center;gap:9px;padding:9px 12px}
.entry .cat{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:15px;background:rgba(0,0,0,.05);flex:0 0 26px}
.entry .mid{flex:1;min-width:0}
.entry .n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.entry .amt.out{color:var(--bad)}
.entry .amt.in{color:var(--ok)}
.entry .acts{display:none;border-top:1px solid var(--line);font-size:12px}
.entry.open .acts{display:flex}
.entry .acts button{flex:1;background:none;border:0;padding:9px;color:var(--text);font-size:12.5px;cursor:pointer}
.entry .acts button+button{border-left:1px solid var(--line)}
.entry .acts .del{color:var(--bad)}
footer{background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);position:sticky;bottom:0}
.chips{display:none;gap:6px;overflow-x:auto;padding:0 2px 8px;scrollbar-width:none}
.chips.on{display:flex}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;background:var(--bg);border:1px solid var(--line);color:var(--sub);border-radius:14px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.chips button:active{background:var(--line)}
.inrow{display:flex;gap:8px;align-items:center}
.inrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:18px;padding:9px 14px;font-size:15px;outline:none}
.inrow input:focus{border-color:var(--accent)}
.inrow button{border:0;background:var(--accent);color:#fff;border-radius:18px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
.inrow button:disabled{opacity:.4}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:60;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .panel{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:86vh;overflow-y:auto}
.sheet h3{margin:0 0 14px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{background:none;border:0;color:var(--accent);font-size:14px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid button{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 4px;font-size:12px;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.grid button span:first-child{font-size:19px}
.grid button.sel{border-color:var(--accent);background:rgba(255,107,138,.12)}
.field{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.field input{width:110px;text-align:right;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:7px 10px;font-size:14px;outline:none}
.field input.wide{width:150px;text-align:left}
.adv{margin:14px 0 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.adv summary{padding:12px 14px;font-size:13.5px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;color:var(--sub)}
.adv summary::-webkit-details-marker{display:none}
.adv summary span{font-size:11.5px;opacity:.75}
.adv .field{padding:10px 14px;margin:0;border-top:1px solid var(--line)}
.btn2{width:100%;margin-top:14px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px;cursor:pointer}
.btn2.pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.stats{font-size:13px}
.stats .day{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.stats .day .d{width:42px;color:var(--sub);font-variant-numeric:tabular-nums}
.stats .day .b{flex:1;height:14px;background:var(--bg);border-radius:4px;overflow:hidden}
.stats .day .b i{display:block;height:100%;background:linear-gradient(90deg,#ffc2cf,var(--accent));border-radius:4px}
.stats .day .v{width:62px;text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:18px 0}
@media(display-mode:standalone){header{padding-top:calc(env(safe-area-inset-top) + 14px)}}
.bub.typing{display:flex;gap:5px;align-items:center;padding:12px 14px}
.bub.typing i{width:6px;height:6px;border-radius:50%;background:var(--sub);opacity:.5;animation:tk 1.1s infinite}
.bub.typing i:nth-child(2){animation-delay:.18s}
.bub.typing i:nth-child(3){animation-delay:.36s}
@keyframes tk{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
.msg.sys .bub.time{font-size:11.5px;letter-spacing:.2px}
#stream{scroll-behavior:smooth}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="ghost"></span>
    <div class="t">账本<small id="hSub">今天还没记账</small></div>
    <button id="btnSet" aria-label="设置">⚙</button>
  </header>
  <div id="summary" role="button" aria-label="查看统计">
    <div class="line"><span id="sLbl">本月花</span><b id="sOut">¥0</b><span class="rt" id="sRight">还没设预算</span><span class="caret">›</span></div>
    <div class="bar"><div class="fill" id="sBar"></div></div>
  </div>
  <main id="stream"></main>
  <footer>
    <div class="chips" id="chips"></div>
    <div class="inrow">
      <input id="inp" placeholder="说一句，比如 午饭12" autocomplete="off" enterkeyhint="send">
      <button id="send">发送</button>
    </div>
  </footer>
</div>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<script>
/* ---------- 数据 ---------- */
var KEY="chatledger.v2";
var CATS=[
 {k:"早餐",e:"🥟",ws:["早饭","早餐","包子","豆浆","煎饼","肠粉","油条","馒头","早点","咖啡站"]},
 {k:"午餐",e:"🍱",ws:["午饭","午餐","外卖","盖饭","麻辣烫","快餐","食堂","盒饭","拉面","米线","螺蛳粉","黄焖鸡"]},
 {k:"晚餐",e:"🍜",ws:["晚饭","晚餐","夜宵","宵夜","烧烤","火锅","聚餐","麻辣香锅","小龙虾"]},
 {k:"饮品",e:"🥤",ws:["奶茶","咖啡","瑞幸","星巴克","可乐","柠檬茶","果汁","蜜雪","喜茶","霸王茶姬","茶百道","纯茶"]},
 {k:"零食",e:"🍪",ws:["零食","薯片","巧克力","饼干","水果","西瓜","苹果","香蕉","冰淇淋","雪糕","蛋糕","面包"]},
 {k:"交通",e:"🚇",ws:["打车","滴滴","地铁","公交","高铁","火车","加油","停车","机票","单车","顺风车"]},
 {k:"日用",e:"🧻",ws:["抽纸","纸巾","日用","洗发水","牙膏","洗衣液","超市","便利店","垃圾袋","沐浴露","秤","体重秤","收纳","拖把","台灯","垃圾桶"]},
 {k:"购物",e:"🛍️",ws:["衣服","鞋","淘宝","京东","拼多多","网购","快递","化妆品","护肤品","耳机","壳","保护壳","手机壳","平板","充电","数据线","充电器","配件","键盘","鼠标","显示器","家电","手表","眼镜"]},
 {k:"居住",e:"🏠",ws:["房租","水电","燃气","物业","电费","水费"]},
 {k:"通讯",e:"📱",ws:["话费","流量","宽带","会员","订阅","网费","iCloud"]},
 {k:"娱乐",e:"🎮",ws:["电影","游戏","KTV","门票","演出","充值","皮肤","桌游","演唱会"]},
 {k:"医疗",e:"💊",ws:["药","医院","挂号","体检","看病","牙","挂号费"]},
 {k:"学习",e:"📚",ws:["书","课程","网课","文具","考试","培训","会员课"]},
 {k:"人情",e:"🎁",ws:["红包","礼物","份子","请客","随礼","转给","打赏"]},
 {k:"收入",e:"💰",ws:["工资","报销","奖金","退款","收入","到账","赚了","发了"],income:true},
 {k:"其他",e:"🧾",ws:[]}
];
var S=load();
function load(){
  try{var r=JSON.parse(localStorage.getItem(KEY));if(r&&r.entries)return r;}catch(e){}
  return {settings:{budget:3000,name:"小账",avatar:"🐱"},entries:[],msgs:[],seeded:false};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
/* ---------- 解析 ---------- */
var CN={零:0,〇:0,一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
var UNIT={十:10,百:100,千:1000};
function cn2num(s){var t=0,sec=0,n=0;for(var i=0;i<s.length;i++){var c=s[i];
  if(CN[c]!==undefined){n=CN[c];}
  else if(UNIT[c]!==undefined){if(n===0)n=1;sec+=n*UNIT[c];n=0;}
  else if(c==="万"){sec+=n;t+=sec*10000;sec=0;n=0;}}
  return t+sec+n;}
function pickAmount(text,catHit){
  var a=text.match(/[0-9]+(?:\.[0-9]{1,2})?/);
  if(a){var v=parseFloat(a[0]);return isFinite(v)&&v>0?v:null;}
  var m=text.match(/[零〇一二两三四五六七八九十百千]+/);
  if(m){
    var base=cn2num(m[0]);
    if(!(base>0))return null;
    var hasUnit=/(?:块钱|块|元|RMB|¥)/.test(text);
    if(!hasUnit&&!catHit)return null;
    var jiao=text.match(/(?:块钱|块|元)\s*([一二三四五六七八九])(?:\s*(?:角|毛))?/);
    if(jiao){base+=CN[jiao[1]]/10;}
    return base;
  }
  return null;}
function pickCat(text){
  for(var i=0;i<CATS.length;i++){var c=CATS[i];
    for(var j=0;j<c.ws.length;j++){if(text.indexOf(c.ws[j])>-1)return{c:c,hit:c.ws[j],conf:0.9};}}
  /* 没命中关键词：只有「几乎就是个金额」时才按时段猜，带实义字的（如「平板保护壳」）一律记成「其他」 */
  var rest=text
    .replace(/[0-9]+(?:\.[0-9]{1,2})?/g,"")
    .replace(/[零〇一二两三四五六七八九十百千万]+/g,"")
    .replace(/块钱|块|元|角|毛|RMB|¥/g,"")
    .replace(/昨天|前天|今早|今天|刚才|上午|下午|中午|早上|晚上|凌晨|夜里|夜宵|早餐时间/g,"")
    .replace(/[\s,，。.!！?？、~～\-+\/]/g,"");
  if(!rest.length){
    var h=new Date().getHours();
    if(h<5)return{c:CATS[2],hit:"amount",conf:0.6};
    if(h<10)return{c:CATS[0],hit:"amount",conf:0.75};
    if(h<15)return{c:CATS[1],hit:"amount",conf:0.75};
    return{c:CATS[2],hit:"amount",conf:0.75};
  }
  return{c:CATS[15],hit:null,conf:0.45};}
function parse(text){
  var pc=pickCat(text);
  var amount=pickAmount(text,!!pc.hit);
  if(!amount)return null;
  var ts=Date.now();
  if(text.indexOf("昨天")>-1)ts-=86400000;
  else if(text.indexOf("前天")>-1)ts-=172800000;
  var inc=pc.c.income||text.indexOf("收入")>-1||text.indexOf("+)")>-1;
  return {amount:amount,cat:pc.c.k,emoji:pc.c.e,conf:pc.conf,ts:ts,income:!!inc,note:text.trim()};
}
/* ---------- 记账 ---------- */
var TYPING_MS=520;
function addEntry(p){
  var e={id:uid(),ts:p.ts,amount:Math.round(p.amount*100)/100,cat:p.cat,emoji:p.emoji,income:p.income,conf:p.conf,note:p.note};
  S.entries.push(e);
  S.msgs.push({id:uid(),ts:Date.now(),from:"me",type:"text",text:p.note});
  save();render();
  var wantAI=aiOn();
  var local=reply(e);
  function push(txt){
    typing(false);
    S.msgs.push({id:uid(),ts:Date.now(),from:"bot",type:"entry",entryId:e.id});
    if(txt)S.msgs.push({id:uid(),ts:Date.now()+1,from:"bot",type:"text",text:txt});
    save();render();
  }
  /* 本地模式且没什么非说不可的 —— 直接出账单，不刷评价 */
  if(!wantAI&&!local){push("");return;}
  typing(true);
  setTimeout(function(){
    if(wantAI){aiLine(e,function(t){push(t||local);});return;}
    push(local);
  },TYPING_MS);
}
/* 微信式「对方正在输入…」 */
function typing(on){
  var st=document.getElementById("stream"),sub=document.getElementById("hSub");
  var el=document.getElementById("typingRow");
  if(on){
    if(el)return;
    var d=document.createElement("div");
    d.id="typingRow";d.className="msg bot";
    d.innerHTML='<div class="av">'+esc(S.settings.avatar||"🐱")+'</div><div class="body"><div class="bub typing"><i></i><i></i><i></i></div></div>';
    st.appendChild(d);st.scrollTop=st.scrollHeight;
    if(sub)sub.textContent="对方正在输入…";
  }else{
    if(el)el.remove();
    if(sub)renderSummary();
  }
}
/* ---------- 可选：接自己的大模型（默认关闭，不填就是纯本地） ---------- */
function aiCfg(){var g=S.settings||{};return {url:(g.aiUrl||"").trim(),key:(g.aiKey||"").trim(),model:(g.aiModel||"").trim()||"deepseek-chat"};}
function aiOn(){var c=aiCfg();return !!(c.url&&c.key);}
function aiLine(e,done){
  var c=aiCfg(),me=monthEntries().filter(function(x){return !x.income;});
  var out=sum(me),budget=S.settings.budget||0;
  var sys="你叫"+(S.settings.name||"小账")+"，是用户的记账搭子和朋友。说话口语化、短、像微信里真人发消息，1 句话不超过 26 个字，可以用一个 emoji。不要列清单，不要说教，不要重复用户原话。";
  var u="我刚记了一笔："+e.cat+" "+e.amount+" 元"+(e.income?"（收入）":"")+"，原话「"+e.note+"」。本月已花 "+out.toFixed(2)+" 元，月预算 "+budget+" 元。请回我一句。";
  var ctrl=("undefined"!==typeof AbortController)?new AbortController():null;
  var timer=ctrl?setTimeout(function(){ctrl.abort();},9000):null;
  fetch(c.url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+c.key},
    body:JSON.stringify({model:c.model,temperature:0.9,max_tokens:80,messages:[{role:"system",content:sys},{role:"user",content:u}]}),
    signal:ctrl?ctrl.signal:undefined})
   .then(function(r){return r.json();})
   .then(function(j){var t=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;if(timer)clearTimeout(timer);done(t?String(t).trim().slice(0,80):null);})
   .catch(function(){if(timer)clearTimeout(timer);done(null);});
}
/* 打开时角色主动搭话（视频里第 3 屏那种感觉） */
function nudge(){
  var now=Date.now(),t0=new Date();t0.setHours(0,0,0,0);
  var today=S.entries.filter(function(e){return e.ts>=t0.getTime();}).length;
  var gap=now-(S.lastOpen||0);
  S.lastOpen=now;save();
  if(S.msgs.length<4)return;
  if(today>0)return;
  if(gap<3*3600*1000)return;
  var pool=["今天还一笔都没记哦，别忘了","醒着吗？今天花了什么，说给我听","今天过得怎么样，花了多少？","提醒一下，今天还没记账 🙂"];
  S.msgs.push({id:uid(),ts:now,from:"bot",type:"text",text:pool[Math.floor(Math.random()*pool.length)]});
  save();
}
function monthEntries(){var d=new Date(),y=d.getFullYear(),m=d.getMonth();
  return S.entries.filter(function(e){var t=new Date(e.ts);return t.getFullYear()===y&&t.getMonth()===m;});}
function sum(list){return list.reduce(function(a,e){return a+(e.income?-e.amount:e.amount);},0);}
/* ---------- 角色台词 ---------- */
/* 原则：记账只出账单卡片，不刷评价。只在用户真需要知道时才说一句。 */
function reply(e){
  if(e.income)return "";
  var me=monthEntries().filter(function(x){return !x.income;});
  var out=sum(me),budget=S.settings.budget||0,left=budget-out;
  /* 1) 分类是猜的 —— 必须告诉用户，否则记错了他不知道 */
  if(e.conf&&e.conf<0.7)return "没听出是什么，先记成「"+e.cat+"」，点卡片能改";
  /* 2) 本月第一次超支 —— 说一次，不重复念 */
  if(budget>0&&left<0){
    var d=new Date(),mk=d.getFullYear()+"-"+(d.getMonth()+1);
    if(S.oversaid!==mk){S.oversaid=mk;return "这个月超了 "+money(-left);}
  }
  return "";
}
/* ---------- 渲染 ---------- */
function money(v){var n=Math.abs(v);var s=n>=1000?n.toFixed(0):n.toFixed(2);s=s.replace(/\.00$/,"").replace(/(\.\d)0$/,"$1");return "¥"+s;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function renderSummary(){
  var me=monthEntries().filter(function(x){return !x.income;});
  var out=sum(me);var b=S.settings.budget||0;var left=b-out;
  var now=new Date(),dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  var leftDays=Math.max(1,dim-now.getDate()+1);
  document.getElementById("sOut").textContent=money(out);
  document.getElementById("sBar").style.width=Math.min(100,b>0?out/b*100:0)+"%";
  var rt=document.getElementById("sRight");
  if(left<0){rt.className="rt bad";rt.textContent="超支 "+money(left);}
  else if(b>0){rt.className="rt";rt.textContent="剩 "+money(left)+" · 日均 "+money(Math.round(left/leftDays));}
  else{rt.className="rt";rt.textContent="点右上角设预算";}
  var today=S.entries.filter(function(e){return new Date(e.ts).toDateString()===now.toDateString();});
  var tOut=sum(today.filter(function(e){return !e.income;}));
  var tIn=sum(today.filter(function(e){return e.income;}));
  document.getElementById("hSub").textContent=today.length
    ? ("今天 "+today.length+" 笔 · "+money(tOut)+(tIn>0?" 收 "+money(tIn):""))
    : "今天还没记账";
  var ch=document.getElementById("chips");
  if(ch)ch.className=S.entries.length?"chips":"chips on";}
function timeLabel(ts){
  var d=new Date(ts),n=new Date(),t0=new Date();t0.setHours(0,0,0,0);
  var hm=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
  if(ts>=t0.getTime())return "今天 "+hm;
  if(ts>=t0.getTime()-86400000)return "昨天 "+hm;
  return (d.getMonth()+1)+"月"+d.getDate()+"日 "+hm;
}
function render(){
  var st=document.getElementById("stream");var h="";var last=0;
  S.msgs.forEach(function(m){
    if(!last||m.ts-last>5*60000){h+='<div class="msg sys"><div class="bub time">'+timeLabel(m.ts)+"</div></div>";}
    last=m.ts;
    if(m.from==="sys"){h+='<div class="msg sys"><div class="bub">'+esc(m.text)+"</div></div>";return;}
    var isMe=m.from==="me";
    var av=isMe?"😊":(S.settings.avatar||"🐱");
    var inner="";
    if(m.type==="text"){inner='<div class="bub">'+esc(m.text)+"</div>";}
    else if(m.type==="entry"){
      var e=S.entries.filter(function(x){return x.id===m.entryId;})[0];
      if(!e)return;
      inner='<div class="bub entry" data-id="'+e.id+'"><div class="top"><div class="cat">'+e.emoji+'</div>'+
        '<div class="mid"><div class="n">'+esc(e.cat)+(e.income?' <span style="font-size:11px;font-weight:400;color:var(--ok)">收入</span>':'')+'</div></div>'+
        '<div class="amt '+(e.income?"in":"out")+'">'+(e.income?"+":"-")+money(e.amount)+'</div></div>'+
        '<div class="acts"><button data-act="cat">修改分类</button><button class="del" data-act="del">删除</button></div></div>';
    }
    h+='<div class="msg '+(isMe?"me":"bot")+'"><div class="av">'+av+'</div><div class="body">'+inner+"</div></div>";
  });
  if(!S.msgs.length)h='<div class="empty">发一条消息就开始记账，比如「午饭12」</div>';
  st.innerHTML=h;
  st.querySelectorAll(".entry").forEach(function(el){
    el.addEventListener("click",function(ev){
      var btn=ev.target.closest("button");
      if(btn){ev.stopPropagation();
        if(btn.dataset.act==="del"){deleteEntry(el.dataset.id);}
        else{openCatPicker(el.dataset.id);}
        return;}
      el.classList.toggle("open");
    });
  });
  st.scrollTop=st.scrollHeight;
  renderSummary();
}
function deleteEntry(id){
  S.entries=S.entries.filter(function(e){return e.id!==id;});
  S.msgs=S.msgs.filter(function(m){return m.entryId!==id;});
  save();render();}
/* ---------- 弹层 ---------- */
var sheet=document.getElementById("sheet"),panel=document.getElementById("panel");
function closeSheet(){sheet.classList.remove("on");}
sheet.addEventListener("click",function(e){if(e.target===sheet)closeSheet();});
function openCatPicker(id){
  var e=S.entries.filter(function(x){return x.id===id;})[0];if(!e)return;
  var h='<h3>修改分类<button id="cClose">完成</button></h3><div class="grid">';
  CATS.forEach(function(c){h+='<button data-k="'+c.k+'" data-e="'+c.e+'" class="'+(c.k===e.cat?"sel":"")+'"><span>'+c.e+'</span><span>'+c.k+"</span></button>";});
  h+="</div>";panel.innerHTML=h;sheet.classList.add("on");
  panel.querySelector("#cClose").onclick=function(){closeSheet();};
  panel.querySelectorAll(".grid button").forEach(function(b){
    b.onclick=function(){e.cat=b.dataset.k;e.emoji=b.dataset.e;save();render();closeSheet();};});
}
function openStats(){
  var me=monthEntries().filter(function(x){return !x.income;});
  var byCat={};me.forEach(function(e){byCat[e.cat]=(byCat[e.cat]||0)+e.amount;});
  var arr=Object.keys(byCat).map(function(k){return [k,byCat[k]];}).sort(function(a,b){return b[1]-a[1];});
  var total=sum(me);var h='<h3>本月账单<button id="stClose">关闭</button></h3>';
  h+='<div class="field"><span>总支出</span><b>'+money(total)+"</b></div>";
  if(!arr.length){h+='<div class="empty">这个月还没记账</div>';}
  else{
    h+='<div style="margin:14px 0 8px;font-size:12px;color:var(--sub)">按分类</div><div class="stats">';
    arr.forEach(function(a){h+='<div class="day"><div class="d">'+a[0]+'</div><div class="b"><i style="width:'+(a[1]/arr[0][1]*100)+'%"></i></div><div class="v">'+money(a[1])+"</div></div>";});
    h+="</div>";
    var byDay={};me.forEach(function(e){var d=new Date(e.ts);var k=(d.getMonth()+1)+"/"+d.getDate();byDay[k]=(byDay[k]||0)+e.amount;});
    var days=Object.keys(byDay).map(function(k){return [k,byDay[k]];}).slice(-14);
    var mx=Math.max.apply(null,days.map(function(d){return d[1];}));
    h+='<div style="margin:16px 0 8px;font-size:12px;color:var(--sub)">最近 14 天</div><div class="stats">';
    days.forEach(function(d){h+='<div class="day"><div class="d">'+d[0]+'</div><div class="b"><i style="width:'+(d[1]/mx*100)+'%"></i></div><div class="v">'+money(d[1])+"</div></div>";});
    h+="</div>";
  }
  panel.innerHTML=h;sheet.classList.add("on");
  panel.querySelector("#stClose").onclick=closeSheet;
}
function openSettings(){
  var h='<h3>设置<button id="setClose">完成</button></h3>';
  h+='<div class="field"><span>月预算</span><input id="fBudget" type="number" inputmode="decimal" value="'+(S.settings.budget||0)+'"></div>';
  h+='<div class="field"><span>角色名</span><input id="fName" class="wide" value="'+esc(S.settings.name||"")+'"></div>';
  h+='<div class="field"><span>角色头像(emoji)</span><input id="fAvatar" class="wide" style="width:70px;text-align:center" value="'+esc(S.settings.avatar||"🐱")+'"></div>';
  var ac=aiCfg();
  h+='<button class="btn2 pri" id="fSave">保存</button>';
  h+='<details class="adv"><summary>进阶：接自己的大模型<span>不填＝本地台词，免费</span></summary>';
  h+='<div class="field"><span>接口</span><input id="fAiUrl" class="wide" placeholder="接口地址" value="'+esc(ac.url)+'"></div>';
  h+='<div class="field"><span>Key</span><input id="fAiKey" class="wide" type="password" placeholder="sk-..." value="'+esc(ac.key)+'"></div>';
  h+='<div class="field"><span>模型</span><input id="fAiModel" class="wide" placeholder="deepseek-chat" value="'+esc(ac.model)+'"></div>';
  h+='</details>';
  h+='<button class="btn2" id="fExport">导出备份（JSON）</button>';
  h+='<button class="btn2" id="fImport">导入备份</button>';
  h+='<button class="btn2" id="fClear" style="color:var(--bad)">清空全部数据</button>';
  h+='<div style="margin-top:14px;font-size:11.5px;color:var(--sub);line-height:1.6">数据只存在这台设备的浏览器里，不上传任何服务器。换手机或换浏览器前先导出备份。</div>';
  panel.innerHTML=h;sheet.classList.add("on");
  panel.querySelector("#setClose").onclick=closeSheet;
  panel.querySelector("#fSave").onclick=function(){
    var aiBefore=JSON.stringify(aiCfg());
    S.settings.budget=parseFloat(panel.querySelector("#fBudget").value)||0;
    S.settings.name=panel.querySelector("#fName").value||"小账";
    S.settings.avatar=panel.querySelector("#fAvatar").value||"🐱";
    S.settings.aiUrl=panel.querySelector("#fAiUrl").value.trim();
    S.settings.aiKey=panel.querySelector("#fAiKey").value.trim();
    S.settings.aiModel=panel.querySelector("#fAiModel").value.trim();
    save();render();closeSheet();
    if(aiBefore!==JSON.stringify(aiCfg())){
      S.msgs.push({id:uid(),ts:Date.now(),from:"bot",type:"text",text:aiOn()?"已连上模型":"已用回本地"});
      save();render();
    }};
  panel.querySelector("#fExport").onclick=function(){
    var blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="聊记备份-"+new Date().toISOString().slice(0,10)+".json";a.click();};
  panel.querySelector("#fImport").onclick=function(){
    var inp=document.createElement("input");inp.type="file";inp.accept="application/json";
    inp.onchange=function(){var f=inp.files[0];if(!f)return;var r=new FileReader();
      r.onload=function(){try{var d=JSON.parse(r.result);if(d.entries){S=d;save();render();closeSheet();}}catch(e){alert("文件读不了");}};
      r.readAsText(f);};inp.click();};
  panel.querySelector("#fClear").onclick=function(){
    if(confirm("清空后无法恢复，确定？")){localStorage.removeItem(KEY);S=load();bootstrap();render();closeSheet();}};
}
/* ---------- 输入 ---------- */
function submit(){
  var i=document.getElementById("inp");var t=i.value.trim();if(!t)return;
  i.value="";
  var p=parse(t);
  if(!p){
    S.msgs.push({id:uid(),ts:Date.now(),from:"me",type:"text",text:t});
    S.msgs.push({id:uid(),ts:Date.now()+1,from:"bot",type:"text",text:"没听出金额。试着说「午饭12」「打车 23.5」「奶茶十五」"});
    save();render();return;}
  addEntry(p);}
document.getElementById("send").onclick=submit;
document.getElementById("inp").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();submit();}});
document.getElementById("summary").onclick=openStats;
document.getElementById("btnSet").onclick=openSettings;
var CHIPS=["午饭12","奶茶15","地铁4","打车23","超市68","工资8000"];
document.getElementById("chips").innerHTML=CHIPS.map(function(c){return "<button>"+c+"</button>";}).join("");
document.getElementById("chips").addEventListener("click",function(e){
  if(e.target.tagName!=="BUTTON")return;
  document.getElementById("inp").value=e.target.textContent;submit();});
/* ---------- 启动 ---------- */
function bootstrap(){
  if(S.seeded)return;
  S.seeded=true;
  S.msgs.push({id:uid(),ts:Date.now()-2000,from:"bot",type:"text",text:"我是 "+(S.settings.name||"小账")+"，发一句话我就记好"});
  S.msgs.push({id:uid(),ts:Date.now()-1000,from:"bot",type:"text",text:"午饭12 · 奶茶十五 · 昨天打车38"});
  save();
}
(function(){
  var q=new URLSearchParams(location.search).get("add");
  if(q){var p=parse(decodeURIComponent(q));if(p){addEntry(p);var u=location.pathname;history.replaceState({},"",u);}}
})();
bootstrap();nudge();render();
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){});});
}
</script>
</body>
</html>
